name: DCO Check
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DCO Check
        run: |
          commits=$(git log --format='%B' origin/main..HEAD 2>/dev/null || git log --format='%B' HEAD)
          if echo "$commits" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
            echo "DCO check passed: Signed-off-by found"
          else
            echo "DCO check failed: No Signed-off-by line found in commits"
            echo "Please use 'git commit -s' to sign your commits"
            exit 1
          fi